name: CI

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: glade-tools
    steps:
      - uses: actions/checkout@v6
        with:
          path: glade-tools
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.GLADE_APP_CLIENT_ID }}
          private-key: ${{ secrets.GLADE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            glade
            glade-tools
          permission-contents: read
      - name: Resolve glade ref
        id: glade-ref
        env:
          GLADE_REMOTE: https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/glade-sh/glade.git
        run: |
          requested_ref="$(jq -r '.gladeCommit' docs/fixtures/apex-language-rules.json)"
          scripts/resolve-sibling-ref.sh "$GLADE_REMOTE" "$requested_ref" main
      - uses: actions/checkout@v6
        with:
          repository: glade-sh/glade
          path: glade
          ref: ${{ steps.glade-ref.outputs.ref }}
          token: ${{ steps.app-token.outputs.token }}
      - name: Verify pinned glade checkout
        run: test "$(git -C ../glade rev-parse HEAD)" = "$(jq -r '.gladeCommit' docs/fixtures/apex-language-rules.json)"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache-dependency-path: glade-tools/go.sum
      - run: node --test scripts/*.test.mjs

  assurance:
    runs-on: macos-14
    timeout-minutes: 15
    defaults:
      run:
        working-directory: glade-tools
    steps:
      - uses: actions/checkout@v6
        with:
          path: glade-tools
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.GLADE_APP_CLIENT_ID }}
          private-key: ${{ secrets.GLADE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            glade
            glade-tools
          permission-contents: read
      - name: Resolve glade ref
        id: glade-ref
        env:
          GLADE_REMOTE: https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/glade-sh/glade.git
        run: |
          requested_ref="$(jq -r '.gladeCommit' docs/fixtures/apex-language-rules.json)"
          scripts/resolve-sibling-ref.sh "$GLADE_REMOTE" "$requested_ref" main
      - uses: actions/checkout@v6
        with:
          repository: glade-sh/glade
          path: glade
          ref: ${{ steps.glade-ref.outputs.ref }}
          token: ${{ steps.app-token.outputs.token }}
      - name: Verify pinned glade checkout
        run: test "$(git -C ../glade rev-parse HEAD)" = "$(jq -r '.gladeCommit' docs/fixtures/apex-language-rules.json)"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache-dependency-path: glade-tools/go.sum
      - name: Provide Salesforce CLI test stub when absent
        run: test -x /usr/local/bin/sf || sudo install -m 755 /usr/bin/true /usr/local/bin/sf
      - run: scripts/release-check.sh

  macos-release-upload:
    runs-on: macos-14
    timeout-minutes: 3
    defaults:
      run:
        working-directory: glade-tools
    steps:
      - uses: actions/checkout@v6
        with:
          path: glade-tools
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.GLADE_APP_CLIENT_ID }}
          private-key: ${{ secrets.GLADE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            glade
            glade-tools
          permission-contents: read
      - name: Resolve glade ref
        id: glade-ref
        env:
          GLADE_REMOTE: https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/glade-sh/glade.git
        run: |
          requested_ref="$(jq -r '.gladeCommit' docs/fixtures/apex-language-rules.json)"
          scripts/resolve-sibling-ref.sh "$GLADE_REMOTE" "$requested_ref" main
      - uses: actions/checkout@v6
        with:
          repository: glade-sh/glade
          path: glade
          ref: ${{ steps.glade-ref.outputs.ref }}
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache-dependency-path: glade-tools/go.sum
      - name: Test release uploader with macOS system Bash
        run: |
          go_bin="$(command -v go)"
          /bin/bash --version | head -n 1 | grep -Eq '^GNU bash, version 3\.2\.'
          env PATH=/bin:/usr/bin "$go_bin" test ./scripts/release_asset_upload_test.go -run TestReleaseAssetUpload -count=1
