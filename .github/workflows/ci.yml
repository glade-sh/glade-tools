name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glade-tools
    steps:
      - uses: actions/checkout@v6
        with:
          path: glade-tools
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.GLADE_APP_CLIENT_ID }}
          private-key: ${{ secrets.GLADE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            glade
            glade-tools
          permission-contents: read
      - uses: actions/checkout@v6
        with:
          repository: glade-sh/glade
          path: glade
          ref: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'main' }}
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache-dependency-path: glade-tools/go.sum
      - run: scripts/release-check.sh
