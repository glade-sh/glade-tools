name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glade-tools
    steps:
      - uses: actions/checkout@v6
        with:
          path: glade-tools
      - uses: actions/checkout@v6
        with:
          repository: glade-sh/glade
          path: glade
          ref: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'main' }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
      - run: scripts/release-check.sh
