name: Salesforce Correctness

on:
  workflow_dispatch:
    inputs:
      glade_sha:
        description: Full 40-hex glade commit to gate
        required: true
        type: string

permissions:
  contents: read

jobs:
  salesforce-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: glade-tools
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: glade-tools
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare evidence directory
        run: |
          mkdir -p "$RUNNER_TEMP/salesforce-correctness-evidence"
          printf '%s\n' "Salesforce correctness workflow started." \
            > "$RUNNER_TEMP/salesforce-correctness-evidence/workflow-started.txt"
          scratch_identity="glade-correctness-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "SF_SCRATCH_ALIAS=$scratch_identity" >> "$GITHUB_ENV"
          echo "SF_SCRATCH_MARKER=$scratch_identity" >> "$GITHUB_ENV"
      - name: Validate glade commit input
        env:
          GLADE_SHA: ${{ inputs.glade_sha }}
        run: |
          if [[ ! "$GLADE_SHA" =~ ^([0-9a-fA-F]{40})$ ]]; then
            echo "glade_sha must be a full 40-hex commit" >&2
            exit 1
          fi
          GLADE_SHA="${GLADE_SHA,,}"
          echo "GLADE_SHA=${GLADE_SHA}" >> "$GITHUB_ENV"
          TOOLS_SHA="$(git rev-parse HEAD)"
          [[ "$TOOLS_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$TOOLS_SHA" = "$GITHUB_SHA"
          echo "TOOLS_SHA=${TOOLS_SHA}" >> "$GITHUB_ENV"
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.GLADE_APP_CLIENT_ID }}
          private-key: ${{ secrets.GLADE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            glade
            glade-tools
          permission-contents: read
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: glade-sh/glade
          path: glade
          ref: ${{ inputs.glade_sha }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - name: Verify glade checkout identity
        run: test "$(git -C ../glade rev-parse HEAD)" = "$GLADE_SHA"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: glade-tools/go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli@2.145.6
      - name: Build release-shaped Linux candidate
        working-directory: glade
        run: |
          set -euo pipefail
          VERSION="sf-correctness-${GLADE_SHA:0:12}"
          payload_dir="$RUNNER_TEMP/glade-shared-payload"
          mkdir -p "$payload_dir"
          DIST_DIR="$payload_dir" VERSION="$VERSION" scripts/release-build.sh shared-payload
          VERSION="$VERSION" \
            RELEASE_SHARED_PAYLOAD_ARCHIVE="$payload_dir/glade-shared-payload.tar.gz" \
            RELEASE_SHARED_PAYLOAD_SHA256="$payload_dir/glade-shared-payload.tar.gz.sha256" \
            scripts/release-build.sh platform
          archive="dist/glade_${VERSION}_linux_amd64.tar.gz"
          extract_dir="$RUNNER_TEMP/glade-candidate"
          mkdir -p "$extract_dir"
          tar -xzf "$archive" -C "$extract_dir" glade
          test -x "$extract_dir/glade"
          echo "GLADE_CANDIDATE=$extract_dir/glade" >> "$GITHUB_ENV"
      - name: Authenticate Salesforce
        env:
          AUTH_URL: ${{ secrets.SF_SFDX_AUTH_URL }}
        run: |
          set -euo pipefail
          AUTH_FILE="$RUNNER_TEMP/sfdx-auth-url.txt"
          LOGIN_RESULT="$RUNNER_TEMP/sf-login.json"
          LOGIN_ERROR="$RUNNER_TEMP/sf-login.stderr"
          trap 'rm -f "$AUTH_FILE" "$LOGIN_RESULT" "$LOGIN_ERROR"' EXIT
          umask 077
          printf '%s' "$AUTH_URL" > "$AUTH_FILE"
          chmod 600 "$AUTH_FILE"
          if ! sf org login sfdx-url \
            --sfdx-url-file "$AUTH_FILE" \
            --alias glade-dev-hub \
            --json > "$LOGIN_RESULT" 2> "$LOGIN_ERROR"; then
            echo "Salesforce authentication failed." >&2
            exit 1
          fi
      - name: Create scratch org
        run: |
          set -euo pipefail
          definition="$RUNNER_TEMP/scratch-def.json"
          printf '%s\n' '{"orgName":"Glade Salesforce Correctness","edition":"Developer"}' > "$definition"
          sf org create scratch \
            --target-dev-hub glade-dev-hub \
            --definition-file "$definition" \
            --alias "$SF_SCRATCH_ALIAS" \
            --name "$SF_SCRATCH_MARKER" \
            --duration-days 1 \
            --json > "$RUNNER_TEMP/salesforce-correctness-evidence/org-create.json"
      - name: Build glade-tools
        run: |
          go build -o "$RUNNER_TEMP/glade-tools" ./cmd/glade-tools
          echo "TOOLS_BIN=$RUNNER_TEMP/glade-tools" >> "$GITHUB_ENV"
      - name: Run correctness gate
        run: |
          scripts/salesforce-correctness-gate.sh \
            "$TOOLS_BIN" \
            "$(realpath ../glade)" \
            "$GLADE_CANDIDATE" \
            "$SF_SCRATCH_ALIAS" \
            "$RUNNER_TEMP/salesforce-correctness-evidence/gate"
      - name: Delete scratch org
        if: always()
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/salesforce-correctness-evidence"

          set +e
          sf org delete scratch \
            --target-org "$SF_SCRATCH_ALIAS" \
            --no-prompt \
            --json > "$evidence/org-cleanup.json" 2>&1
          set -e

          scratch_query="SELECT Id, ScratchOrg, SignupUsername, Status FROM ScratchOrgInfo WHERE OrgName = '$SF_SCRATCH_MARKER'"
          request_status="NONE"
          scratch_org="-"
          for poll in {1..12}; do
            scratch_info="$evidence/scratch-org-info-$poll.json"
            sf data query --target-org glade-dev-hub --query "$scratch_query" --json > "$scratch_info"
            read -r request_status scratch_org < <(python3 - "$scratch_info" <<'PY'
          import json, re, sys
          payload = json.load(open(sys.argv[1]))
          records = payload.get("result", {}).get("records", [])
          if payload.get("status") != 0 or payload.get("result", {}).get("totalSize") != len(records) or len(records) > 1:
              raise SystemExit("invalid ScratchOrgInfo marker result")
          if not records:
              print("NONE -")
              raise SystemExit
          row = records[0]
          if not re.fullmatch(r"2SR[0-9A-Za-z]{12}(?:[0-9A-Za-z]{3})?", row.get("Id", "")) or not row.get("Status"):
              raise SystemExit("invalid ScratchOrgInfo identity")
          org = row.get("ScratchOrg") or "-"
          if org != "-" and not re.fullmatch(r"00D[0-9A-Za-z]{12}(?:[0-9A-Za-z]{3})?", org):
              raise SystemExit("invalid scratch org identity")
          print(row["Status"], org)
          PY
            )
            if [[ "$scratch_org" != "-" || "$request_status" == "Error" ]]; then
              break
            fi
            if [[ "$poll" -lt 12 ]]; then
              sleep 5
            fi
          done

          if [[ "$scratch_org" != "-" ]]; then
            active_query="SELECT Id, ScratchOrg FROM ActiveScratchOrg WHERE ScratchOrg = '$scratch_org'"
            sf data query --target-org glade-dev-hub --query "$active_query" --json \
              > "$evidence/active-scratch-org.json"
            active_id="$(python3 - "$evidence/active-scratch-org.json" "$scratch_org" <<'PY'
          import json, re, sys
          payload = json.load(open(sys.argv[1]))
          records = payload.get("result", {}).get("records", [])
          if payload.get("status") != 0 or payload.get("result", {}).get("totalSize") != len(records) or len(records) > 1:
              raise SystemExit("invalid ActiveScratchOrg result")
          if not records:
              print("-")
              raise SystemExit
          row = records[0]
          if row.get("ScratchOrg") != sys.argv[2] or not re.fullmatch(r"2AS[0-9A-Za-z]{12}(?:[0-9A-Za-z]{3})?", row.get("Id", "")):
              raise SystemExit("invalid ActiveScratchOrg identity")
          print(row["Id"])
          PY
          )"
            if [[ "$active_id" != "-" ]]; then
              sf data delete record --target-org glade-dev-hub \
                --sobject ActiveScratchOrg --record-id "$active_id" --json \
                > "$evidence/active-scratch-org-cleanup.json"
            fi
            sf data query --target-org glade-dev-hub --query "$active_query" --json \
              > "$evidence/active-scratch-org-post-cleanup.json"
            python3 - "$evidence/active-scratch-org-post-cleanup.json" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1]))
          records = payload.get("result", {}).get("records", [])
          if payload.get("status") != 0 or payload.get("result", {}).get("totalSize") != 0 or records:
              raise SystemExit("remaining ActiveScratchOrg residue")
          PY
          elif [[ "$request_status" != "NONE" && "$request_status" != "Error" ]]; then
            echo "scratch org request remains pending" >&2
            exit 1
          fi

          set +e
          sf org logout --target-org "$SF_SCRATCH_ALIAS" --no-prompt --json \
            > "$evidence/org-logout.json" 2>&1
          sf org display --target-org "$SF_SCRATCH_ALIAS" --json \
            > "$evidence/org-post-cleanup.json" 2>&1
          display_status=$?
          set -e
          test "$display_status" -ne 0
      - name: Write Salesforce release authority
        run: |
          evidence="$RUNNER_TEMP/salesforce-correctness-evidence"
          receipt="$evidence/salesforce-release-authority.json"
          sidecar="$evidence/salesforce-release-authority.json.sha256"
          jq -S -c -n \
            --arg gladeSHA "$GLADE_SHA" \
            --arg toolsSHA "$TOOLS_SHA" \
            --argjson workflowRunID "$GITHUB_RUN_ID" \
            --argjson workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg workflowRunURL "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            '{schemaVersion: 1, gladeSHA: $gladeSHA, toolsSHA: $toolsSHA, workflowRunID: $workflowRunID, workflowRunAttempt: $workflowRunAttempt, workflowRunURL: $workflowRunURL, gateStatus: "PASS", cleanupStatus: "PASS", evidenceArtifactName: "salesforce-correctness-evidence"}' \
            > "$receipt"
          printf '%s  %s\n' "$(shasum -a 256 "$receipt" | awk '{print $1}')" "$(basename "$receipt")" > "$sidecar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: salesforce-correctness-evidence
          path: ${{ runner.temp }}/salesforce-correctness-evidence
          if-no-files-found: error
          retention-days: 90
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: authority-token
        with:
          client-id: ${{ vars.GLADE_APP_CLIENT_ID }}
          private-key: ${{ secrets.GLADE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: glade
          permission-checks: write
      - name: Publish Salesforce release authority
        env:
          GH_TOKEN: ${{ steps.authority-token.outputs.token }}
        run: |
          receipt="$RUNNER_TEMP/salesforce-correctness-evidence/salesforce-release-authority.json"
          sidecar="$RUNNER_TEMP/salesforce-correctness-evidence/salesforce-release-authority.json.sha256"
          scripts/publish-salesforce-authority.sh "$receipt" "$sidecar" "glade-sh/glade" "Salesforce Correctness"
