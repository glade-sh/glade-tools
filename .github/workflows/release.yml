name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && 'v0.2.12' || github.ref_name }}
  TOOLS_SHA: ${{ github.event_name == 'workflow_dispatch' && '18dd0e23cb540fdacdaaafa51b69c35d25426436' || github.sha }}

jobs:
  salesforce-authority:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: glade-tools
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: glade-tools
          ref: ${{ env.TOOLS_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify Tools release identity
        run: |
          test "$(git rev-parse HEAD)" = "$TOOLS_SHA"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          tag_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{}")"
          test "$tag_sha" = "$TOOLS_SHA"
      - name: Read pinned glade ref
        id: glade-ref
        run: |
          requested_ref="$(jq -er '.gladeCommit | select(type == "string" and test("^[0-9a-f]{40}$"))' docs/fixtures/apex-language-rules.json)"
          printf 'ref=%s\n' "$requested_ref" >> "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.GLADE_APP_CLIENT_ID }}
          private-key: ${{ secrets.GLADE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: glade
          permission-checks: read
          permission-contents: read
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: glade-sh/glade
          path: glade
          ref: ${{ steps.glade-ref.outputs.ref }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - name: Verify pinned glade checkout
        run: |
          requested_ref="$(jq -r '.gladeCommit' docs/fixtures/apex-language-rules.json)"
          test "$(git -C ../glade rev-parse HEAD)" = "$requested_ref"
      - name: Verify Salesforce release authority
        env:
          GITHUB_REPOSITORY: glade-sh/glade
        run: |
          requested_ref="$(jq -er '.gladeCommit | select(type == "string" and test("^[0-9a-f]{40}$"))' docs/fixtures/apex-language-rules.json)"
          public_check_runs_response="$RUNNER_TEMP/public-check-runs.json"
          curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --output "$public_check_runs_response" \
            "https://api.github.com/repos/glade-sh/glade/commits/$requested_ref/check-runs?per_page=100&filter=latest&check_name=Salesforce%20Correctness"
          jq -e 'type == "object" and (.total_count | type == "number") and (.check_runs | type == "array")' "$public_check_runs_response" >/dev/null
          mkdir -p "$RUNNER_TEMP/public-gh"
          cat > "$RUNNER_TEMP/public-gh/gh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          cat "$PUBLIC_CHECK_RUNS_RESPONSE"
          EOF
          chmod 500 "$RUNNER_TEMP/public-gh/gh"
          export PUBLIC_CHECK_RUNS_RESPONSE="$public_check_runs_response"
          PATH="$RUNNER_TEMP/public-gh:$PATH" \
            env -u GH_TOKEN -u GITHUB_TOKEN \
              ../glade/scripts/verify-salesforce-check.sh "$requested_ref" "$TOOLS_SHA" > salesforce-release-authority.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: salesforce-release-authority
          path: glade-tools/salesforce-release-authority.json
          if-no-files-found: error
          retention-days: 90

  required-gates:
    needs: salesforce-authority
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.TOOLS_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify Tools release identity
        run: |
          test "$(git rev-parse HEAD)" = "$TOOLS_SHA"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          tag_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{}")"
          test "$tag_sha" = "$TOOLS_SHA"
      - name: Verify required release gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify-release-gates.sh "$GITHUB_REPOSITORY" "$TOOLS_SHA" > required-gates.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: required-gates
          path: required-gates.json
          if-no-files-found: error
          retention-days: 90

  prepare:
    needs: required-gates
    if: (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && needs.required-gates.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TOOLS_SHA }}
          fetch-depth: 0
      - name: Verify Tools release identity
        run: |
          test "$(git rev-parse HEAD)" = "$TOOLS_SHA"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          tag_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{}")"
          test "$tag_sha" = "$TOOLS_SHA"
      - name: Build release notes
        shell: bash
        run: scripts/release-notes.sh "$RELEASE_TAG" > release-notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            target_commitish="$(gh release view "$RELEASE_TAG" --json targetCommitish --jq '.targetCommitish')"
            test "$target_commitish" = "$TOOLS_SHA"
            echo "Release $RELEASE_TAG already exists; reusing it without mutation"
          else
            gh release create "$RELEASE_TAG" \
              --target "$TOOLS_SHA" \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md
          fi

  build:
    needs:
      - salesforce-authority
      - required-gates
      - prepare
    if: >-
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) &&
      needs.salesforce-authority.result == 'success' &&
      needs.required-gates.result == 'success' &&
      needs.prepare.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            target: linux/amd64
            artifact: linux-amd64
            asset_suffix: linux_amd64
          - runs-on: ubuntu-24.04-arm
            target: linux/arm64
            artifact: linux-arm64
            asset_suffix: linux_arm64
          - runs-on: macos-15-intel
            target: darwin/amd64
            artifact: darwin-amd64
            asset_suffix: darwin_amd64
          - runs-on: macos-14
            target: darwin/arm64
            artifact: darwin-arm64
            asset_suffix: darwin_arm64
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: write
    defaults:
      run:
        working-directory: glade-tools
    steps:
      - uses: actions/checkout@v6
        with:
          path: glade-tools
          ref: ${{ env.TOOLS_SHA }}
          fetch-depth: 0
      - name: Verify Tools release identity
        run: |
          test "$(git rev-parse HEAD)" = "$TOOLS_SHA"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          tag_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{}")"
          test "$tag_sha" = "$TOOLS_SHA"
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.GLADE_APP_CLIENT_ID }}
          private-key: ${{ secrets.GLADE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            glade
            glade-tools
          permission-contents: read
      - name: Read pinned glade ref
        id: glade-ref
        run: |
          requested_ref="$(jq -er '.gladeCommit | select(type == "string" and test("^[0-9a-f]{40}$"))' docs/fixtures/apex-language-rules.json)"
          printf 'ref=%s\n' "$requested_ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: glade-sh/glade
          path: glade
          ref: ${{ steps.glade-ref.outputs.ref }}
          token: ${{ steps.app-token.outputs.token }}
      - name: Verify pinned glade checkout
        run: test "$(git -C ../glade rev-parse HEAD)" = "$(jq -r '.gladeCommit' docs/fixtures/apex-language-rules.json)"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache-dependency-path: glade-tools/go.sum
      - name: Build plugin archives
        shell: bash
        env:
          VERSION: ${{ env.RELEASE_TAG }}
          TARGETS: ${{ matrix.target }}
          OUT_DIR: ${{ github.workspace }}/glade-tools/dist/plugins
        run: scripts/build-plugin-archives.sh "${VERSION#v}"
      - name: Name platform checksums
        run: cp dist/plugins/checksums.txt dist/plugins/checksums-${{ matrix.artifact }}.txt
      - name: Upload platform release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ env.RELEASE_TAG }}
        run: |
          scripts/release-asset-upload.sh "$RELEASE_TAG" \
            dist/plugins/glade-plugin-compat_${VERSION#v}_${{ matrix.asset_suffix }}.tar.gz \
            dist/plugins/glade-plugin-orgpackage_${VERSION#v}_${{ matrix.asset_suffix }}.tar.gz \
            dist/plugins/glade-plugin-performance_${VERSION#v}_${{ matrix.asset_suffix }}.tar.gz \
            dist/plugins/checksums-${{ matrix.artifact }}.txt

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TOOLS_SHA }}
          fetch-depth: 0
      - name: Verify Tools release identity
        run: |
          test "$(git rev-parse HEAD)" = "$TOOLS_SHA"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          tag_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{}")"
          test "$tag_sha" = "$TOOLS_SHA"
      - name: Download platform release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          rm -rf dist/plugins
          mkdir -p dist/plugins
          gh release download "$RELEASE_TAG" \
            --dir dist/plugins \
            --pattern '*.tar.gz' \
            --pattern 'checksums-*.txt' \
            --clobber
      - name: Assemble plugin registry
        shell: bash
        env:
          VERSION: ${{ env.RELEASE_TAG }}
          PLUGIN_ASSET_BASE_URL: https://plugins.glade.sh/${{ env.RELEASE_TAG }}
        run: |
          cat dist/plugins/checksums-*.txt > dist/plugins/checksums.txt
          LC_ALL=C sort dist/plugins/checksums.txt -o dist/plugins/checksums.txt
          python3 scripts/build-plugin-registry.py \
            --version "$VERSION" \
            --asset-base-url "$PLUGIN_ASSET_BASE_URL" \
            --archive-dir dist/plugins \
            --checksums dist/plugins/checksums.txt \
            --output dist/plugins/index.json
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          scripts/release-asset-upload.sh "$RELEASE_TAG" \
            dist/plugins/checksums.txt \
            dist/plugins/index.json
