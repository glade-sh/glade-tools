name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version label for plugin artifacts.
        required: false
        default: "0.2.0"

jobs:
  required-gates:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify required release gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify-release-gates.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA" > required-gates.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: required-gates
          path: required-gates.json
          if-no-files-found: error
          retention-days: 90

  prepare:
    needs: required-gates
    if: startsWith(github.ref, 'refs/tags/') && needs.required-gates.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build release notes
        shell: bash
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; reusing it without mutation"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi

  build:
    needs:
      - required-gates
      - prepare
    if: >-
      always() &&
      ((startsWith(github.ref, 'refs/tags/') &&
        needs.required-gates.result == 'success' &&
        needs.prepare.result == 'success') ||
       (github.event_name == 'workflow_dispatch' &&
        needs.required-gates.result == 'skipped' &&
        needs.prepare.result == 'skipped'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            target: linux/amd64
            artifact: linux-amd64
            asset_suffix: linux_amd64
          - runs-on: ubuntu-24.04-arm
            target: linux/arm64
            artifact: linux-arm64
            asset_suffix: linux_arm64
          - runs-on: macos-15-intel
            target: darwin/amd64
            artifact: darwin-amd64
            asset_suffix: darwin_amd64
          - runs-on: macos-14
            target: darwin/arm64
            artifact: darwin-arm64
            asset_suffix: darwin_arm64
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: write
    defaults:
      run:
        working-directory: glade-tools
    steps:
      - uses: actions/checkout@v6
        with:
          path: glade-tools
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.GLADE_APP_CLIENT_ID }}
          private-key: ${{ secrets.GLADE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            glade
            glade-tools
          permission-contents: read
      - name: Read pinned glade ref
        id: glade-ref
        run: |
          requested_ref="$(jq -er '.gladeCommit | select(type == "string" and test("^[0-9a-f]{40}$"))' docs/fixtures/apex-language-rules.json)"
          printf 'ref=%s\n' "$requested_ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: glade-sh/glade
          path: glade
          ref: ${{ steps.glade-ref.outputs.ref }}
          token: ${{ steps.app-token.outputs.token }}
      - name: Verify pinned glade checkout
        run: test "$(git -C ../glade rev-parse HEAD)" = "$(jq -r '.gladeCommit' docs/fixtures/apex-language-rules.json)"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache-dependency-path: glade-tools/go.sum
      - name: Build plugin archives
        shell: bash
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          TARGETS: ${{ matrix.target }}
          OUT_DIR: ${{ github.workspace }}/glade-tools/dist/plugins
        run: scripts/build-plugin-archives.sh "${VERSION#v}"
      - name: Name platform checksums
        run: cp dist/plugins/checksums.txt dist/plugins/checksums-${{ matrix.artifact }}.txt
      - name: Upload platform release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          scripts/release-asset-upload.sh "$GITHUB_REF_NAME" \
            dist/plugins/glade-plugin-compat_${VERSION#v}_${{ matrix.asset_suffix }}.tar.gz \
            dist/plugins/glade-plugin-orgpackage_${VERSION#v}_${{ matrix.asset_suffix }}.tar.gz \
            dist/plugins/glade-plugin-performance_${VERSION#v}_${{ matrix.asset_suffix }}.tar.gz \
            dist/plugins/checksums-${{ matrix.artifact }}.txt

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download platform release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          rm -rf dist/plugins
          mkdir -p dist/plugins
          gh release download "$GITHUB_REF_NAME" \
            --dir dist/plugins \
            --pattern '*.tar.gz' \
            --pattern 'checksums-*.txt' \
            --clobber
      - name: Assemble plugin registry
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          PLUGIN_ASSET_BASE_URL: https://plugins.glade.sh/${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          cat dist/plugins/checksums-*.txt > dist/plugins/checksums.txt
          LC_ALL=C sort dist/plugins/checksums.txt -o dist/plugins/checksums.txt
          python3 scripts/build-plugin-registry.py \
            --version "$VERSION" \
            --asset-base-url "$PLUGIN_ASSET_BASE_URL" \
            --archive-dir dist/plugins \
            --checksums dist/plugins/checksums.txt \
            --output dist/plugins/index.json
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          scripts/release-asset-upload.sh "$GITHUB_REF_NAME" \
            dist/plugins/checksums.txt \
            dist/plugins/index.json
