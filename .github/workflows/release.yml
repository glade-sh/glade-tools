name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version label for plugin artifacts.
        required: false
        default: "0.2.0"

jobs:
  prepare:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build release notes
        shell: bash
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; reusing it without mutation"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi

  build:
    needs: prepare
    if: always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            target: linux/amd64
            artifact: linux-amd64
            asset_suffix: linux_amd64
          - runs-on: ubuntu-24.04-arm
            target: linux/arm64
            artifact: linux-arm64
            asset_suffix: linux_arm64
          - runs-on: macos-15-intel
            target: darwin/amd64
            artifact: darwin-amd64
            asset_suffix: darwin_amd64
          - runs-on: macos-14
            target: darwin/arm64
            artifact: darwin-arm64
            asset_suffix: darwin_arm64
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: write
    defaults:
      run:
        working-directory: glade-tools
    steps:
      - uses: actions/checkout@v6
        with:
          path: glade-tools
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.GLADE_APP_CLIENT_ID }}
          private-key: ${{ secrets.GLADE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            glade
            glade-tools
          permission-contents: read
      - name: Resolve glade ref
        id: glade-ref
        env:
          GLADE_REMOTE: https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/glade-sh/glade.git
          REQUESTED_REF: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'main' }}
        run: scripts/resolve-sibling-ref.sh "$GLADE_REMOTE" "$REQUESTED_REF" main
      - uses: actions/checkout@v6
        with:
          repository: glade-sh/glade
          path: glade
          ref: ${{ steps.glade-ref.outputs.ref }}
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache-dependency-path: glade-tools/go.sum
      - name: Build plugin archives
        shell: bash
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          TARGETS: ${{ matrix.target }}
          OUT_DIR: ${{ github.workspace }}/glade-tools/dist/plugins
        run: scripts/build-plugin-archives.sh "${VERSION#v}"
      - name: Name platform checksums
        run: cp dist/plugins/checksums.txt dist/plugins/checksums-${{ matrix.artifact }}.txt
      - name: Upload platform release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/plugins/glade-plugin-compat_${VERSION#v}_${{ matrix.asset_suffix }}.tar.gz \
            dist/plugins/glade-plugin-orgpackage_${VERSION#v}_${{ matrix.asset_suffix }}.tar.gz \
            dist/plugins/glade-plugin-performance_${VERSION#v}_${{ matrix.asset_suffix }}.tar.gz \
            dist/plugins/checksums-${{ matrix.artifact }}.txt

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          rm -rf dist/plugins
          mkdir -p dist/plugins
          gh release download "$GITHUB_REF_NAME" \
            --dir dist/plugins \
            --pattern '*.tar.gz' \
            --pattern 'checksums-*.txt' \
            --clobber
      - name: Assemble plugin registry
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          PLUGIN_ASSET_BASE_URL: https://plugins.glade.sh/${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          cd dist/plugins
          cat checksums-*.txt > checksums.txt
          python3 <<'PY'
          import glob
          import json
          import os
          import re

          version = os.environ["VERSION"].removeprefix("v")
          base_url = os.environ["PLUGIN_ASSET_BASE_URL"].rstrip("/")
          sums = {}
          with open("checksums.txt", "r", encoding="utf-8") as f:
              for line in f:
                  parts = line.strip().split()
                  if len(parts) == 2:
                      sums[parts[1]] = parts[0]

          metadata = {
              "compat": {
                  "name": "@glade/compat",
                  "aliases": ["compat"],
                  "summary": "Maintainer support tools, fixtures, surface ledgers, and parity scanners.",
                  "commands": ["compat", "surface", "local-tests", "post-parity", "dashboard", "gaps", "stdlib"],
                  "docsURL": "https://glade.sh/maintainer/glade-tools",
              },
              "orgpackage": {
                  "name": "@glade/orgpackage",
                  "aliases": ["orgpackage"],
                  "summary": "Capture installed Salesforce package artifacts from an org.",
                  "commands": ["orgpackage"],
                  "docsURL": "https://glade.sh/guide/rich-local-workflows",
              },
              "performance": {
                  "name": "@glade/performance",
                  "aliases": ["performance"],
                  "summary": "Advisory Salesforce performance scanner.",
                  "commands": ["performance"],
                  "docsURL": "https://glade.sh/guide/plugins/first-party",
              },
          }
          rows = {name: {**data, "version": version, "publisher": "glade", "trust": "first-party", "sourceURL": "https://github.com/glade-sh/glade-tools", "minimumGladeVersion": "0.1.0", "assets": []} for name, data in metadata.items()}
          pattern = re.compile(r"glade-plugin-(compat|orgpackage|performance)_(.+)_([^_]+)_([^_]+)\.tar\.gz$")
          for archive in sorted(glob.glob("*.tar.gz")):
              match = pattern.match(archive)
              if not match:
                  raise SystemExit(f"unexpected archive name: {archive}")
              plugin, _, goos, goarch = match.groups()
              rows[plugin]["assets"].append({
                  "os": goos,
                  "arch": goarch,
                  "url": f"{base_url}/{archive}",
                  "sha256": sums[archive],
              })
          index = {"version": 1, "plugins": [rows["compat"], rows["orgpackage"], rows["performance"]]}
          with open("index.json", "w", encoding="utf-8") as f:
              json.dump(index, f, indent=2, sort_keys=True)
              f.write("\n")
          PY
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/plugins/checksums.txt \
            dist/plugins/index.json
