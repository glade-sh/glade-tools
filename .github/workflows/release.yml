name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version label for plugin artifacts.
        required: false
        default: "0.2.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            target: linux/amd64
            artifact: linux-amd64
          - runs-on: ubuntu-24.04-arm
            target: linux/arm64
            artifact: linux-arm64
          - runs-on: macos-15-intel
            target: darwin/amd64
            artifact: darwin-amd64
          - runs-on: macos-14
            target: darwin/arm64
            artifact: darwin-arm64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
      - name: Build plugin archives
        shell: bash
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          TARGETS: ${{ matrix.target }}
          OUT_DIR: dist/plugins
        run: scripts/build-plugin-archives.sh "${VERSION#v}"
      - name: Name platform checksums
        run: cp dist/plugins/checksums.txt dist/plugins/checksums-${{ matrix.artifact }}.txt
      - uses: actions/upload-artifact@v7
        with:
          name: glade-plugin-release-${{ matrix.artifact }}
          path: |
            dist/plugins/*.tar.gz
            dist/plugins/checksums-${{ matrix.artifact }}.txt
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist/plugins
          merge-multiple: true
      - name: Assemble plugin registry
        shell: bash
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          PLUGIN_ASSET_BASE_URL: https://plugins.glade.sh/${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          cd dist/plugins
          cat checksums-*.txt > checksums.txt
          python3 <<'PY'
          import glob
          import json
          import os
          import re

          version = os.environ["VERSION"].removeprefix("v")
          base_url = os.environ["PLUGIN_ASSET_BASE_URL"].rstrip("/")
          sums = {}
          with open("checksums.txt", "r", encoding="utf-8") as f:
              for line in f:
                  parts = line.strip().split()
                  if len(parts) == 2:
                      sums[parts[1]] = parts[0]

          metadata = {
              "compat": {
                  "name": "@glade/compat",
                  "aliases": ["compat"],
                  "summary": "Maintainer support tools, fixtures, surface ledgers, and parity scanners.",
                  "commands": ["compat", "surface", "local-tests", "post-parity", "dashboard", "gaps", "stdlib"],
                  "docsURL": "https://glade.sh/maintainer/glade-tools",
              },
              "orgpackage": {
                  "name": "@glade/orgpackage",
                  "aliases": ["orgpackage"],
                  "summary": "Capture installed Salesforce package artifacts from an org.",
                  "commands": ["orgpackage"],
                  "docsURL": "https://glade.sh/guide/rich-local-workflows",
              },
              "performance": {
                  "name": "@glade/performance",
                  "aliases": ["performance"],
                  "summary": "Advisory Salesforce performance scanner.",
                  "commands": ["performance"],
                  "docsURL": "https://glade.sh/guide/plugins/first-party",
              },
          }
          rows = {name: {**data, "version": version, "publisher": "glade", "trust": "first-party", "sourceURL": "https://github.com/glade-sh/glade-tools", "minimumGladeVersion": "0.1.0", "assets": []} for name, data in metadata.items()}
          pattern = re.compile(r"glade-plugin-(compat|orgpackage|performance)_(.+)_([^_]+)_([^_]+)\.tar\.gz$")
          for archive in sorted(glob.glob("*.tar.gz")):
              match = pattern.match(archive)
              if not match:
                  raise SystemExit(f"unexpected archive name: {archive}")
              plugin, _, goos, goarch = match.groups()
              rows[plugin]["assets"].append({
                  "os": goos,
                  "arch": goarch,
                  "url": f"{base_url}/{archive}",
                  "sha256": sums[archive],
              })
          index = {"version": 1, "plugins": [rows["compat"], rows["orgpackage"], rows["performance"]]}
          with open("index.json", "w", encoding="utf-8") as f:
              json.dump(index, f, indent=2, sort_keys=True)
              f.write("\n")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: glade-plugin-release-artifacts
          path: dist/plugins/*
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          files="$(find dist/plugins -maxdepth 1 -type f -print)"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
          else
            gh release create "$GITHUB_REF_NAME" $files \
              --title "$GITHUB_REF_NAME" \
              --notes "First-party Glade plugin archives."
          fi
